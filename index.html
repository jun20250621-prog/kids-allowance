<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐷 小豬存錢筒 - 兒童版消費記帳本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FFB6C1;
            --secondary: #98D8C8;
            --accent: #FFD93D;
            --text: #5D5D5D;
            --bg: #FFF9F0;
            --white: #FFFFFF;
            --income: #4CAF50;
            --expense: #FF6B6B;
        }

        body {
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', cursive, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--primary);
            text-shadow: 2px 2px 0 var(--accent);
        }

        .mascot {
            font-size: 4rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, var(--primary) 0%, #FFB8D0 100%);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
        }

        .balance-card h2 {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .balance-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed rgba(255,255,255,0.3);
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .icon {
            font-size: 1.5rem;
        }

        .stat-item .label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .stat-item .amount {
            font-size: 1rem;
            font-weight: bold;
        }

        .income { color: #2E7D32; }
        .expense { color: #C62828; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--white);
            color: var(--text);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tab-btn:hover {
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--secondary);
            color: white;
        }

        .tab-btn.active.expense-tab {
            background: var(--expense);
        }

        /* Form */
        .form-card {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .form-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn.income {
            background: var(--income);
            color: white;
        }

        .submit-btn.expense {
            background: var(--expense);
            color: white;
        }

        .submit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Records */
        .records-section {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .records-header h3 {
            font-size: 1.2rem;
        }

        .clear-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 10px;
            background: #eee;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .record-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: var(--bg);
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .record-item:hover {
            transform: translateX(5px);
        }

        .record-icon {
            font-size: 2rem;
            margin-right: 15px;
        }

        .record-info {
            flex: 1;
        }

        .record-category {
            font-weight: bold;
            font-size: 1rem;
        }

        .record-note {
            font-size: 0.85rem;
            color: #888;
        }

        .record-amount {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .record-amount.income {
            color: var(--income);
        }

        .record-amount.expense {
            color: var(--expense);
        }

        .record-date {
            font-size: 0.75rem;
            color: #aaa;
            margin-left: 10px;
        }

        .delete-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        /* Data Management */
        .data-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .data-buttons .data-btn {
            flex: 1 1 calc(50% - 4px);
            min-width: 0;
            text-align: center;
            padding: 12px 8px;
            font-size: 0.85rem;
        }

        .data-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            background: #eee;
            transition: background 0.3s;
        }

        .data-btn:hover {
            background: #ddd;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Stats Tab */
        .stats-content {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .chart-placeholder {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .record-item {
            animation: slideIn 0.3s ease;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: var(--primary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .category-section {
            margin-bottom: 20px;
        }

        .category-section h4 {
            margin-bottom: 10px;
            color: var(--text);
        }

        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: var(--bg);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .category-item .cat-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-item .cat-icon {
            font-size: 1.2rem;
        }

        .category-item .cat-name {
            font-weight: bold;
        }

        .category-item .cat-actions {
            display: flex;
            gap: 5px;
        }

        .category-item .cat-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .category-item .cat-actions button:hover {
            background: #eee;
        }

        .add-category-btn {
            width: 100%;
            padding: 12px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            background: none;
            color: #888;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .add-category-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        /* Date Input */
        .date-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .date-input-group label {
            font-weight: bold;
            white-space: nowrap;
        }

        .date-input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
        }

        .date-input-group input:focus {
            outline: none;
            border-color: var(--secondary);
        }

        /* Sync */
        .sync-banner{display:none;background:linear-gradient(135deg,#98D8C8,#7DC8B6);border-radius:12px;padding:10px 15px;margin-bottom:15px;color:white;font-size:.85rem;align-items:center;gap:8px}
        .sync-banner.synced{background:linear-gradient(135deg,#4CAF50,#388E3C)}
        .sync-banner.syncing{background:linear-gradient(135deg,#FF9800,#F57C00)}
        .sync-banner.error{background:linear-gradient(135deg,#f44336,#d32f2f)}
        .sync-banner .sync-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.8)}
        .sync-banner.syncing .sync-dot{animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .sync-btn-nav{background:#98D8C8;color:white}
        .sync-btn-nav:hover{background:#7DC8B6}
        .sync-btn-nav.active{background:#4CAF50}
        .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
        @keyframes spin{to{transform:rotate(360deg)}}
        .sync-modal-content{max-width:420px}
        .sync-status-display{text-align:center;padding:15px;margin-bottom:20px;background:#F5F5F5;border-radius:12px}
        .sync-status-display .status-icon{font-size:2.5rem;margin-bottom:8px}
        .sync-status-display .status-text{font-size:.9rem;color:#888}
        .sync-form-group{margin-bottom:15px}
        .sync-form-group label{display:block;margin-bottom:5px;font-weight:bold;color:#5D5D5D;font-size:.9rem}
        .sync-form-group input{width:100%;padding:12px 15px;border:2px solid #eee;border-radius:12px;font-size:.95rem}
        .sync-form-group input:focus{outline:none;border-color:#98D8C8}
        .sync-form-group .hint{font-size:.75rem;color:#888;margin-top:4px}
        .sync-info-box{background:#FFF3E0;border-radius:10px;padding:12px;margin-bottom:15px;font-size:.8rem;color:#E65100}
        .sync-actions{display:flex;gap:10px;margin-top:20px}
        .sync-btn-modal{flex:1;padding:12px;border:none;border-radius:12px;font-size:1rem;font-weight:bold;cursor:pointer;transition:all .3s}
        .sync-btn-modal.primary{background:#98D8C8;color:white}
        .sync-btn-modal.primary:hover{background:#7DC8B6}
        .sync-btn-modal.secondary{background:#eee;color:#5D5D5D}
        .sync-btn-modal.secondary:hover{background:#ddd}
        .sync-btn-modal:disabled{opacity:.6;cursor:not-allowed}
        .last-sync-time{font-size:.8rem;color:#888;text-align:center;margin-top:10px}
        .gist-link{display:block;text-align:center;margin-top:12px;font-size:.8rem;color:#98D8C8;word-break:break-all}

    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="mascot">🐷</div>
            <h1>小豬存錢筒</h1>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <h2>🏠 我的小豬公</h2>
            <div class="balance-amount" id="balance">0 元</div>
            <div class="balance-stats">
                <div class="stat-item">
                    <div class="icon">💰</div>
                    <div class="label">總收入</div>
                    <div class="amount" id="total-income">0</div>
                </div>
                <div class="stat-item">
                    <div class="icon">💸</div>
                    <div class="label">總支出</div>
                    <div class="amount" id="total-expense">0</div>
                </div>
            </div>
        </div>
        <div class="sync-banner" id="sync-banner"><div class="sync-dot"></div><span id="sync-banner-text">同步中...</span></div>


        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('income')">💰 收入</button>
            <button class="tab-btn expense-tab" onclick="switchTab('expense')">💸 支出</button>
            <button class="tab-btn" onclick="switchTab('stats')">📊 統計</button>
        </div>

        <!-- Income Form -->
        <div id="income-tab" class="tab-content active">
            <div class="form-card">
                <div class="form-title">➕ 新增收入</div>
                <form id="income-form">
                    <div class="date-input-group">
                        <label>📅 日期</label>
                        <input type="date" id="income-date" required>
                    </div>
                    <div class="form-group">
                        <label>💰 金額</label>
                        <input type="number" id="income-amount" placeholder="多少錢？" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>📝 類型</label>
                        <select id="income-category"></select>
                    </div>
                    <div class="form-group">
                        <label>📋 備註</label>
                        <input type="text" id="income-note" placeholder="多少錢？（選填）">
                    </div>
                    <button type="submit" class="submit-btn income">💰 存進去！</button>
                </form>
            </div>
        </div>

        <!-- Expense Form -->
        <div id="expense-tab" class="tab-content">
            <div class="form-card">
                <div class="form-title">➖ 新增支出</div>
                <form id="expense-form">
                    <div class="date-input-group">
                        <label>📅 日期</label>
                        <input type="date" id="expense-date" required>
                    </div>
                    <div class="form-group">
                        <label>💸 金額</label>
                        <input type="number" id="expense-amount" placeholder="多少錢？" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>📝 類型</label>
                        <select id="expense-category"></select>
                    </div>
                    <div class="form-group">
                        <label>📋 備註</label>
                        <input type="text" id="expense-note" placeholder="買什麼？（選填）">
                    </div>
                    <button type="submit" class="submit-btn expense">💸 花掉！</button>
                </form>
            </div>
        </div>

        <!-- Stats Tab -->
        <div id="stats-tab" class="tab-content">
            <div class="stats-content">
                <h3>📊 消費統計</h3>
                <div class="chart-placeholder">
                    <div class="mascot">📈</div>
                    <p>努力記錄中...<br>記錄越多，統計越準確！</p>
                </div>
            </div>
        </div>

        <!-- Records -->
        <div class="records-section">
            <div class="records-header">
                <h3>📋 記錄列表</h3>
                <button class="clear-btn" onclick="clearAll()">🗑️ 清除</button>
            </div>
            <div id="records-list">
                <div class="empty-state">
                    <div class="icon">📝</div>
                    <p>還沒有記錄哦！<br>開始記錄你的零用錢吧！</p>
                </div>
            </div>
        </div>

        <!-- Data Management -->
        <div class="data-buttons">
            <button class="data-btn" onclick="exportCSV()">📥 匯出</button>
            <button class="data-btn" onclick="document.getElementById('import-file').click()">📤 匯入</button>
            <button class="data-btn" onclick="showCategoryModal()">🏷️ 類別</button>
            <button class="data-btn sync-btn-nav" id="sync-nav-btn" onclick="showSyncModal()">☁️ 同步</button>
            <button class="data-btn" onclick="shareData()">🔗 分享</button>
            <input type="file" id="import-file" accept=".csv" style="display:none" onchange="importCSV(event)">
        </div>

        <!-- Category Management Modal -->
        <div id="category-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>🏷️ 管理類別</h3>
                    <button class="close-btn" onclick="closeCategoryModal()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="category-section">
                        <h4>💰 收入類別</h4>
                        <div id="income-categories" class="category-list"></div>
                        <button class="add-category-btn" onclick="addCategory('income')">➕ 新增類別</button>
                    </div>
                    <div class="category-section">
                        <h4>💸 支出類別</h4>
                        <div id="expense-categories" class="category-list"></div>
                        <button class="add-category-btn" onclick="addCategory('expense')">➕ 新增類別</button>
                    </div>
                </div>
            </div>
        </div>
    
        <div id="sync-modal" class="modal">
            <div class="modal-content sync-modal-content">
                <div class="modal-header"><h3>☁️ 雲端同步設定</h3><button class="close-btn" onclick="closeSyncModal()">✕</button></div>
                <div class="modal-body">
                    <div class="sync-status-display" id="sync-status-display"><div class="status-icon">🔗</div><div class="status-text">尚未設定同步</div></div>
                    <div class="sync-info-box">💡 填入 GitHub Token 並儲存，之後點「推送」即可同步至 Gist。</div>
                    <div class="sync-form-group"><label>🔑 GitHub Personal Access Token</label><input type="password" id="sync-pat" placeholder="ghp_xxxxxxxxxxxx"><div class="hint">需具備 gist 權限</div></div>
                    <div class="sync-form-group"><label>📋 Gist ID</label><input type="text" id="sync-gist-id" value="54fba93beb5088bbe7a8629daed5d0e5" readonly><div class="hint">已預填，請勿修改</div></div>
                    <div class="sync-actions"><button class="sync-btn-modal secondary" onclick="testConnection()" id="test-btn">🔍 測試連線</button><button class="sync-btn-modal primary" onclick="saveSyncSettings()" id="save-btn">💾 儲存設定</button></div>
                    <div class="sync-actions"><button class="sync-btn-modal secondary" onclick="pullFromGist()" id="pull-btn" disabled>⬇️ 拉取</button><button class="sync-btn-modal primary" onclick="pushToGist()" id="push-btn" disabled>⬆️ 推送</button></div>
                    <div class="last-sync-time" id="last-sync-time"></div>
                    <a class="gist-link" id="gist-link" href="#" target="_blank"></a>
                </div>
            </div>
        </div>
</div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>

        // Data
        let records = JSON.parse(localStorage.getItem('piggyRecords')) || [];
        

        const GIST_FILENAME = 'piggy-data.json';
        const GIST_DESCRIPTION = '🐷 小豬存錢筒備份資料';
        let syncSettings = JSON.parse(localStorage.getItem('piggySyncSettings')) || {pat:'',gistId:'54fba93beb5088bbe7a8629daed5d0e5',lastSync:null};
        (function(){if(!localStorage.getItem('piggySyncSettings')){localStorage.setItem('piggySyncSettings',JSON.stringify(syncSettings));}})();

        // Categories - stored in localStorage
        let categories = JSON.parse(localStorage.getItem('piggyCategories')) || {
            income: [
                { id: 1, icon: '🆓', name: '零用錢' },
                { id: 2, icon: '🏆', name: '獎勵' },
                { id: 3, icon: '🧧', name: '紅包' },
                { id: 4, icon: '💼', name: '打工' },
                { id: 5, icon: '📦', name: '其他' }
            ],
            expense: [
                { id: 1, icon: '🍬', name: '零食' },
                { id: 2, icon: '🎮', name: '玩具' },
                { id: 3, icon: '✏️', name: '文具' },
                { id: 4, icon: '🎮', name: '遊戲' },
                { id: 5, icon: '❤️', name: '孝親' },
                { id: 6, icon: '📦', name: '其他' }
            ]
        };

        // Icons
        const categoryIcons = {
            '零用錢': '🆓',
            '獎勵': '🏆',
            '紅包': '🧧',
            '打工': '💼',
            '其他': '📦',
            '零食': '🍬',
            '玩具': '🎮',
            '文具': '✏️',
            '遊戲': '🎮',
            '孝親': '❤️'
        };

        // Render
        function render() {
            renderBalance();
            renderRecords();
            renderCategorySelects();
            updateSyncBanner();
        }

        function renderCategorySelects() {
            const incomeSelect = document.getElementById('income-category');
            const expenseSelect = document.getElementById('expense-category');
            
            incomeSelect.innerHTML = categories.income.map(c => 
                `<option value="${c.name}">${c.icon} ${c.name}</option>`
            ).join('');
            
            expenseSelect.innerHTML = categories.expense.map(c => 
                `<option value="${c.name}">${c.icon} ${c.name}</option>`
            ).join('');
        }

        function renderBalance() {
            const income = records.filter(r => r.type === 'income').reduce((sum, r) => sum + r.amount, 0);
            const expense = records.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.amount, 0);
            const balance = income - expense;

            document.getElementById('balance').textContent = balance + ' 元';
            document.getElementById('total-income').textContent = income;
            document.getElementById('total-expense').textContent = expense;
        }

        function renderRecords() {
            const list = document.getElementById('records-list');
            
            if (records.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <p>還沒有記錄哦！<br>開始記錄你的零用錢吧！</p>
                    </div>
                `;
                return;
            }

            const sorted = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            list.innerHTML = sorted.map((r, i) => `
                <div class="record-item">
                    <div class="record-icon">${r.type === 'income' ? '💰' : '💸'}</div>
                    <div class="record-info">
                        <div class="record-category">${categoryIcons[r.category] || '📦'} ${r.category}</div>
                        <div class="record-note">${r.note || '-'}</div>
                    </div>
                    <div class="record-amount ${r.type}">
                        ${r.type === 'income' ? '+' : '-'}${r.amount}
                    </div>
                    <div class="record-date">${formatDate(r.date)}</div>
                    <button class="delete-btn" onclick="deleteRecord(${records.length - 1 - i})">🗑️</button>
                </div>
            `).join('');
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            
            const dateStr2 = d.toDateString();
            if (dateStr2 === today.toDateString()) {
                return '今天';
            } else if (dateStr2 === yesterday.toDateString()) {
                return '昨天';
            } else {
                return `${d.getMonth()+1}/${d.getDate()}`;
            }
        }

        // Tab
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        // Add Record
        document.getElementById('income-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const date = document.getElementById('income-date').value;
            const amount = parseInt(document.getElementById('income-amount').value);
            const category = document.getElementById('income-category').value;
            const note = document.getElementById('income-note').value;

            records.push({
                type: 'income',
                date: new Date(date).toISOString(),
                amount: amount,
                category: category,
                note: note
            });

            save();
            this.reset();
            showToast('💰 存進去了！');
            render();
        });

        document.getElementById('expense-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const date = document.getElementById('expense-date').value;
            const amount = parseInt(document.getElementById('expense-amount').value);
            const category = document.getElementById('expense-category').value;
            const note = document.getElementById('expense-note').value;

            records.push({
                type: 'expense',
                date: new Date(date).toISOString(),
                amount: amount,
                category: category,
                note: note
            });

            save();
            this.reset();
            showToast('💸 花掉了！');
            render();
        });

        // Delete
        function deleteRecord(index) {
            if (confirm('確定要刪除這筆記錄嗎？')) {
                records.splice(index, 1);
                save();
                render();
            }
        }

        // Clear All
        function clearAll() {
            if (records.length === 0) {
                showToast('沒有記錄可以清除');
                return;
            }
            if (confirm('確定要清除所有記錄嗎？這個動作不能復原哦！')) {
                records = [];
                save();
                render();
                showToast('🗑️ 已清除所有記錄');
            }
        }

        // Save
        function save() {
            localStorage.setItem('piggyRecords', JSON.stringify(records));
        }

        // Export CSV
        function exportCSV() {
            if (records.length === 0) {
                showToast('沒有記錄可以匯出');
                return;
            }

            let csv = '日期,類型,金額,類別,備註\n';
            records.forEach(r => {
                csv += `${r.date},${r.type},${r.amount},${r.category},${r.note || ''}\n`;
            });

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '小豬存錢筒_' + new Date().toISOString().slice(0,10) + '.csv';
            link.click();
            showToast('📥 匯出成功！');
        }

        // Import CSV
        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                let imported = 0;

                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(',');
                    if (cols.length >= 4) {
                        records.push({
                            type: cols[1],
                            amount: parseInt(cols[2]),
                            category: cols[3],
                            note: cols[4] || '',
                            date: cols[0]
                        });
                        imported++;
                    }
                }

                save();
                render();
                showToast(`📤 匯入 ${imported} 筆記錄！`);
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Init
        render();

        // Category Management Functions
        function showCategoryModal() {
            document.getElementById('category-modal').classList.add('show');
            renderCategories();
        }
        
        function closeCategoryModal() {
            document.getElementById('category-modal').classList.remove('show');
        }
        
        function renderCategories() {
            const incomeList = document.getElementById('income-categories');
            const expenseList = document.getElementById('expense-categories');
            
            incomeList.innerHTML = categories.income.map(c => `
                <div class="category-item">
                    <div class="cat-info">
                        <span class="cat-icon">${c.icon}</span>
                        <span class="cat-name">${c.name}</span>
                    </div>
                    <div class="cat-actions">
                        <button onclick="editCategory('income', ${c.id})" title="編輯">✏️</button>
                        <button onclick="deleteCategory('income', ${c.id})" title="刪除">🗑️</button>
                    </div>
                </div>
            `).join('');
            
            expenseList.innerHTML = categories.expense.map(c => `
                <div class="category-item">
                    <div class="cat-info">
                        <span class="cat-icon">${c.icon}</span>
                        <span class="cat-name">${c.name}</span>
                    </div>
                    <div class="cat-actions">
                        <button onclick="editCategory('expense', ${c.id})" title="編輯">✏️</button>
                        <button onclick="deleteCategory('expense', ${c.id})" title="刪除">🗑️</button>
                    
</div>
                </div>
            `).join('');
        }
        
        function addCategory(type) {
            const icon = prompt('請輸入圖示（如 🍎、🎮）：', '📦');
            if (!icon) return;
            const name = prompt('請輸入類別名稱：');
            if (!name) return;
            
            const newId = Math.max(...categories[type].map(c => c.id), 0) + 1;
            categories[type].push({ id: newId, icon: icon, name: name });
            saveCategories();
            renderCategories();
            renderCategorySelects();
            showToast('➕ 已新增類別');
        }
        
        function editCategory(type, id) {
            const cat = categories[type].find(c => c.id === id);
            if (!cat) return;
            
            const icon = prompt('請輸入圖示：', cat.icon);
            if (!icon) return;
            const name = prompt('請輸入類別名稱：', cat.name);
            if (!name) return;
            
            cat.icon = icon;
            cat.name = name;
            saveCategories();
            renderCategories();
            renderCategorySelects();
            showToast('✏️ 已更新類別');
        }
        
        function deleteCategory(type, id) {
            if (!confirm('確定要刪除這個類別嗎？')) return;
            
            categories[type] = categories[type].filter(c => c.id !== id);
            saveCategories();
            renderCategories();
            renderCategorySelects();
            showToast('🗑️ 已刪除類別');
        }
        
        function saveCategories() {
            localStorage.setItem('piggyCategories', JSON.stringify(categories));
        }
        
        // Share Data
        function shareData() {
            const data = {
                records: records,
                categories: categories,
                exportTime: new Date().toISOString()
            };
            
            // Encode to base64
            const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
            const shareUrl = window.location.href.split('?')[0] + '?data=' + encoded;
            
            // Copy to clipboard
            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast('🔗 分享連結已複製到剪貼簿！');
            }).catch(() => {
                // Fallback: show prompt
                prompt('分享連結：', shareUrl);
            });
        }
        
        // Load shared data on startup
        function loadSharedData() {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');
            if (data) {
                try {
                    const decoded = JSON.parse(decodeURIComponent(escape(atob(data))));
                    if (decoded.records) {
                        records = decoded.records;
                        localStorage.setItem('piggyRecords', JSON.stringify(records));
                    }
                    if (decoded.categories) {
                        categories = decoded.categories;
                        localStorage.setItem('piggyCategories', JSON.stringify(categories));
                    }
                    // Remove query string
                    window.history.replaceState({}, '', window.location.pathname);
                    showToast('📥 已載入分享的資料！');
                    render();
                } catch (e) {
                    console.error('載入分享資料失敗', e);
                }
            }
        }
        
        // Init
        loadSharedData();
        render();
        
        // Set default date to today
        document.getElementById('income-date').valueAsDate = new Date();
        document.getElementById('expense-date').valueAsDate = new Date();

        function getGistData(){return{records:records,categories:categories,version:1,exportTime:new Date().toISOString()}}
        function showSyncModal(){document.getElementById('sync-modal').classList.add('show');document.getElementById('sync-pat').value=syncSettings.pat||'';document.getElementById('sync-gist-id').value=syncSettings.gistId||'';updateSyncModalStatus()}
        function closeSyncModal(){document.getElementById('sync-modal').classList.remove('show')}
        function updateSyncModalStatus(){var d=document.getElementById('sync-status-display'),pb=document.getElementById('pull-btn'),pubs=document.getElementById('push-btn'),ls=document.getElementById('last-sync-time'),gl=document.getElementById('gist-link');if(syncSettings.pat&&syncSettings.gistId){d.innerHTML='<div class="status-icon">✅</div><div class="status-text">已設定 GitHub Gist 同步</div>';pb.disabled=false;pubs.disabled=false;gl.style.display='block';gl.href='https://gist.github.com/'+syncSettings.gistId;gl.textContent='gist.github.com/'+syncSettings.gistId}else if(syncSettings.pat){d.innerHTML='<div class="status-icon">⚠️</div><div class="status-text">已設定 Token，需填 Gist ID</div>';pb.disabled=true;pubs.disabled=false;gl.style.display='none'}else{d.innerHTML='<div class="status-icon">🔗</div><div class="status-text">尚未設定同步</div>';pb.disabled=true;pubs.disabled=true;gl.style.display='none'}ls.textContent=syncSettings.lastSync?'上次同步：'+new Date(syncSettings.lastSync).toLocaleString('zh-TW'):''}
        function updateSyncBanner(){var b=document.getElementById('sync-banner'),bt=document.getElementById('sync-banner-text'),n=document.getElementById('sync-nav-btn');if(!b||!bt)return;if(syncSettings.pat&&syncSettings.gistId){b.style.display='flex';b.className='sync-banner synced';bt.textContent='☁️ 已同步至 GitHub Gist';if(n)n.classList.add('active')}else{b.style.display='none';if(n)n.classList.remove('active')}}
        async function testConnection(){var p=document.getElementById('sync-pat').value.trim();if(!p){showToast('⚠️ 請先輸入 PAT');return}var btn=document.getElementById('test-btn');btn.innerHTML='<span class="spinner"></span>測試中...';btn.disabled=true;try{var r=await fetch('https://api.github.com/gists',{method:'GET',headers:{'Authorization':'Bearer '+p,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});showToast(r.ok?'✅ 連線成功！':'❌ 連線失敗：'+r.status)}catch(e){showToast('❌ 網路錯誤：'+e.message)}btn.innerHTML='🔍 測試連線';btn.disabled=false}
        function saveSyncSettings(){var p=document.getElementById('sync-pat').value.trim(),g=document.getElementById('sync-gist-id').value.trim();if(!p){showToast('⚠️ 請輸入 GitHub PAT');return}syncSettings.pat=p;syncSettings.gistId=g;localStorage.setItem('piggySyncSettings',JSON.stringify(syncSettings));updateSyncModalStatus();updateSyncBanner();showToast('💾 設定已儲存！')}
        async function pushToGist(){var p=syncSettings.pat||document.getElementById('sync-pat').value.trim(),g=syncSettings.gistId||document.getElementById('sync-gist-id').value.trim();if(!p){showToast('⚠️ 請先設定 GitHub PAT');return}if(records.length===0){showToast('⚠️ 還沒有記錄，請先新增一筆記錄');return}var pubs=document.getElementById('push-btn');pubs.innerHTML='<span class="spinner"></span>推送中...';pubs.disabled=true;var b=document.getElementById('sync-banner'),bt=document.getElementById('sync-banner-text');b.style.display='flex';b.className='sync-banner syncing';bt.textContent='☁️ 同步中...';try{var body={description:GIST_DESCRIPTION,"public":false,files:{}};body.files[GIST_FILENAME]={content:JSON.stringify(getGistData(),null,2)};var resp=g?await fetch('https://api.github.com/gists/'+g,{method:'PATCH',headers:{'Authorization':'Bearer '+p,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify(body)}):await fetch('https://api.github.com/gists',{method:'POST',headers:{'Authorization':'Bearer '+p,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify(body)});if(resp.ok){var r2=await resp.json();if(!g){syncSettings.gistId=r2.id;document.getElementById('sync-gist-id').value=r2.id;localStorage.setItem('piggySyncSettings',JSON.stringify(syncSettings))}syncSettings.lastSync=new Date().toISOString();localStorage.setItem('piggySyncSettings',JSON.stringify(syncSettings));b.className='sync-banner synced';bt.textContent='☁️ 已同步至 GitHub Gist';showToast('⬆️ 推送成功！');updateSyncModalStatus();updateSyncBanner()}else{var e=await resp.json();throw new Error(e.message||'推送失敗：'+resp.status)}}catch(err){b.className='sync-banner error';bt.textContent='❌ 同步失敗';showToast('❌ '+err.message);setTimeout(function(){updateSyncBanner()},3000)}pubs.innerHTML='⬆️ 推送';pubs.disabled=!(syncSettings.pat&&syncSettings.gistId)}
        async function pullFromGist(){var p=syncSettings.pat||document.getElementById('sync-pat').value.trim(),g=syncSettings.gistId||document.getElementById('sync-gist-id').value.trim();if(!p||!g){showToast('⚠️ 請先設定 PAT 和 Gist ID');return}var pb=document.getElementById('pull-btn');pb.innerHTML='<span class="spinner"></span>拉取中...';pb.disabled=true;var b=document.getElementById('sync-banner'),bt=document.getElementById('sync-banner-text');b.style.display='flex';b.className='sync-banner syncing';bt.textContent='☁️ 同步中...';try{var resp=await fetch('https://api.github.com/gists/'+g,{method:'GET',headers:{'Authorization':'Bearer '+p,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});if(resp.ok){var gist=await resp.json(),f=gist.files[GIST_FILENAME];if(!f)throw new Error('Gist 中找不到備份檔案');var data=JSON.parse(f.content);if(data.records&&data.records.length>0){var lk={};records.forEach(function(r){lk[r.date+'|'+r.amount+'|'+r.type+'|'+r.category]=true});var nc=0;data.records.forEach(function(r){var k=r.date+'|'+r.amount+'|'+r.type+'|'+r.category;if(!lk[k]){records.push(r);nc++}});if(data.categories){['income','expense'].forEach(function(t){if(data.categories[t]){var ex={};categories[t].forEach(function(c){ex[c.name]=true});data.categories[t].forEach(function(c){if(!ex[c.name])categories[t].push(c)})}})}save();render();showToast(nc>0?'⬇️ 拉取成功！新增 '+nc+' 筆記錄':'⬇️ 拉取成功！沒有新資料')}else{showToast('⬇️ Gist 中沒有資料，或資料已全部同步')}syncSettings.lastSync=new Date().toISOString();localStorage.setItem('piggySyncSettings',JSON.stringify(syncSettings));b.className='sync-banner synced';bt.textContent='☁️ 已同步至 GitHub Gist';updateSyncModalStatus();updateSyncBanner()}else if(resp.status===404){throw new Error('找不到指定的 Gist')}else{throw new Error('拉取失敗：'+resp.status)}}catch(err){b.className='sync-banner error';bt.textContent='❌ 同步失敗';showToast('❌ '+err.message);setTimeout(function(){updateSyncBanner()},3000)}pb.innerHTML='⬇️ 拉取';pb.disabled=!(syncSettings.pat&&syncSettings.gistId)}
        updateSyncBanner();

        
</script>
