<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐷 小豬存錢筒 - 兒童版消費記帳本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FFB6C1;
            --secondary: #98D8C8;
            --accent: #FFD93D;
            --text: #5D5D5D;
            --bg: #FFF9F0;
            --white: #FFFFFF;
            --income: #4CAF50;
            --expense: #FF6B6B;
        }

        body {
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', cursive, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--primary);
            text-shadow: 2px 2px 0 var(--accent);
        }

        .mascot {
            font-size: 4rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, var(--primary) 0%, #FFB8D0 100%);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
        }

        .balance-card h2 {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .balance-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed rgba(255,255,255,0.3);
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .icon {
            font-size: 1.5rem;
        }

        .stat-item .label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .stat-item .amount {
            font-size: 1rem;
            font-weight: bold;
        }

        .income { color: #2E7D32; }
        .expense { color: #C62828; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--white);
            color: var(--text);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tab-btn:hover {
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--secondary);
            color: white;
        }

        .tab-btn.active.expense-tab {
            background: var(--expense);
        }

        /* Form */
        .form-card {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .form-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn.income {
            background: var(--income);
            color: white;
        }

        .submit-btn.expense {
            background: var(--expense);
            color: white;
        }

        .submit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Records */
        .records-section {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .records-header h3 {
            font-size: 1.2rem;
        }

        .clear-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 10px;
            background: #eee;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .record-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: var(--bg);
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .record-item:hover {
            transform: translateX(5px);
        }

        .record-icon {
            font-size: 2rem;
            margin-right: 15px;
        }

        .record-info {
            flex: 1;
        }

        .record-category {
            font-weight: bold;
            font-size: 1rem;
        }

        .record-note {
            font-size: 0.85rem;
            color: #888;
        }

        .record-amount {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .record-amount.income {
            color: var(--income);
        }

        .record-amount.expense {
            color: var(--expense);
        }

        .record-date {
            font-size: 0.75rem;
            color: #aaa;
            margin-left: 10px;
        }

        .delete-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        /* Data Management */
        .data-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .data-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            background: #eee;
            transition: background 0.3s;
        }

        .data-btn:hover {
            background: #ddd;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Stats Tab */
        .stats-content {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .chart-placeholder {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .record-item {
            animation: slideIn 0.3s ease;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="mascot">🐷</div>
            <h1>小豬存錢筒</h1>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <h2>🏠 我的小豬公</h2>
            <div class="balance-amount" id="balance">0 元</div>
            <div class="balance-stats">
                <div class="stat-item">
                    <div class="icon">💰</div>
                    <div class="label">總收入</div>
                    <div class="amount" id="total-income">0</div>
                </div>
                <div class="stat-item">
                    <div class="icon">💸</div>
                    <div class="label">總支出</div>
                    <div class="amount" id="total-expense">0</div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('income')">💰 收入</button>
            <button class="tab-btn expense-tab" onclick="switchTab('expense')">💸 支出</button>
            <button class="tab-btn" onclick="switchTab('stats')">📊 統計</button>
        </div>

        <!-- Income Form -->
        <div id="income-tab" class="tab-content active">
            <div class="form-card">
                <div class="form-title">➕ 新增收入</div>
                <form id="income-form">
                    <div class="form-group">
                        <label>💰 金額</label>
                        <input type="number" id="income-amount" placeholder="多少錢？" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>📝 類型</label>
                        <select id="income-category">
                            <option value="零用錢">🆓 零用錢</option>
                            <option value="獎勵">🏆 獎勵</option>
                            <option value="紅包">🧧 紅包</option>
                            <option value="打工">💼 打工</option>
                            <option value="其他">📦 其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📋 備註</label>
                        <input type="text" id="income-note" placeholder="多少錢？（選填）">
                    </div>
                    <button type="submit" class="submit-btn income">💰 存進去！</button>
                </form>
            </div>
        </div>

        <!-- Expense Form -->
        <div id="expense-tab" class="tab-content">
            <div class="form-card">
                <div class="form-title">➖ 新增支出</div>
                <form id="expense-form">
                    <div class="form-group">
                        <label>💸 金額</label>
                        <input type="number" id="expense-amount" placeholder="多少錢？" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>📝 類型</label>
                        <select id="expense-category">
                            <option value="零食">🍬 零食</option>
                            <option value="玩具">🎮 玩具</option>
                            <option value="文具">✏️ 文具</option>
                            <option value="遊戲">🎮 遊戲</option>
                            <option value="孝親">❤️ 孝親</option>
                            <option value="其他">📦 其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📋 備註</label>
                        <input type="text" id="expense-note" placeholder="買什麼？（選填）">
                    </div>
                    <button type="submit" class="submit-btn expense">💸 花掉！</button>
                </form>
            </div>
        </div>

        <!-- Stats Tab -->
        <div id="stats-tab" class="tab-content">
            <div class="stats-content">
                <h3>📊 消費統計</h3>
                <div class="chart-placeholder">
                    <div class="mascot">📈</div>
                    <p>努力記錄中...<br>記錄越多，統計越準確！</p>
                </div>
            </div>
        </div>

        <!-- Records -->
        <div class="records-section">
            <div class="records-header">
                <h3>📋 記錄列表</h3>
                <button class="clear-btn" onclick="clearAll()">🗑️ 清除</button>
            </div>
            <div id="records-list">
                <div class="empty-state">
                    <div class="icon">📝</div>
                    <p>還沒有記錄哦！<br>開始記錄你的零用錢吧！</p>
                </div>
            </div>
        </div>

        <!-- Data Management -->
        <div class="data-buttons">
            <button class="data-btn" onclick="exportCSV()">📥 匯出</button>
            <button class="data-btn" onclick="document.getElementById('import-file').click()">📤 匯入</button>
            <input type="file" id="import-file" accept=".csv" style="display:none" onchange="importCSV(event)">
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Data
        let records = JSON.parse(localStorage.getItem('piggyRecords')) || [];

        // Icons
        const categoryIcons = {
            '零用錢': '🆓',
            '獎勵': '🏆',
            '紅包': '🧧',
            '打工': '💼',
            '其他': '📦',
            '零食': '🍬',
            '玩具': '🎮',
            '文具': '✏️',
            '遊戲': '🎮',
            '孝親': '❤️'
        };

        // Render
        function render() {
            renderBalance();
            renderRecords();
        }

        function renderBalance() {
            const income = records.filter(r => r.type === 'income').reduce((sum, r) => sum + r.amount, 0);
            const expense = records.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.amount, 0);
            const balance = income - expense;

            document.getElementById('balance').textContent = balance + ' 元';
            document.getElementById('total-income').textContent = income;
            document.getElementById('total-expense').textContent = expense;
        }

        function renderRecords() {
            const list = document.getElementById('records-list');
            
            if (records.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <p>還沒有記錄哦！<br>開始記錄你的零用錢吧！</p>
                    </div>
                `;
                return;
            }

            const sorted = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            list.innerHTML = sorted.map((r, i) => `
                <div class="record-item">
                    <div class="record-icon">${r.type === 'income' ? '💰' : '💸'}</div>
                    <div class="record-info">
                        <div class="record-category">${categoryIcons[r.category] || '📦'} ${r.category}</div>
                        <div class="record-note">${r.note || '-'}</div>
                    </div>
                    <div class="record-amount ${r.type}">
                        ${r.type === 'income' ? '+' : '-'}${r.amount}
                    </div>
                    <div class="record-date">${formatDate(r.date)}</div>
                    <button class="delete-btn" onclick="deleteRecord(${records.length - 1 - i})">🗑️</button>
                </div>
            `).join('');
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return `${d.getMonth()+1}/${d.getDate()}`;
        }

        // Tab
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        // Add Record
        document.getElementById('income-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const amount = parseInt(document.getElementById('income-amount').value);
            const category = document.getElementById('income-category').value;
            const note = document.getElementById('income-note').value;

            records.push({
                type: 'income',
                amount: amount,
                category: category,
                note: note,
                date: new Date().toISOString()
            });

            save();
            this.reset();
            showToast('💰 存進去了！');
            render();
        });

        document.getElementById('expense-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const amount = parseInt(document.getElementById('expense-amount').value);
            const category = document.getElementById('expense-category').value;
            const note = document.getElementById('expense-note').value;

            records.push({
                type: 'expense',
                amount: amount,
                category: category,
                note: note,
                date: new Date().toISOString()
            });

            save();
            this.reset();
            showToast('💸 花掉了！');
            render();
        });

        // Delete
        function deleteRecord(index) {
            if (confirm('確定要刪除這筆記錄嗎？')) {
                records.splice(index, 1);
                save();
                render();
            }
        }

        // Clear All
        function clearAll() {
            if (records.length === 0) {
                showToast('沒有記錄可以清除');
                return;
            }
            if (confirm('確定要清除所有記錄嗎？這個動作不能復原哦！')) {
                records = [];
                save();
                render();
                showToast('🗑️ 已清除所有記錄');
            }
        }

        // Save
        function save() {
            localStorage.setItem('piggyRecords', JSON.stringify(records));
        }

        // Export CSV
        function exportCSV() {
            if (records.length === 0) {
                showToast('沒有記錄可以匯出');
                return;
            }

            let csv = '日期,類型,金額,類別,備註\n';
            records.forEach(r => {
                csv += `${r.date},${r.type},${r.amount},${r.category},${r.note || ''}\n`;
            });

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '小豬存錢筒_' + new Date().toISOString().slice(0,10) + '.csv';
            link.click();
            showToast('📥 匯出成功！');
        }

        // Import CSV
        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                let imported = 0;

                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(',');
                    if (cols.length >= 4) {
                        records.push({
                            type: cols[1],
                            amount: parseInt(cols[2]),
                            category: cols[3],
                            note: cols[4] || '',
                            date: cols[0]
                        });
                        imported++;
                    }
                }

                save();
                render();
                showToast(`📤 匯入 ${imported} 筆記錄！`);
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Init
        render();
    </script>
</body>
</html>
